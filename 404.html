<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#101614">
<title>Página no encontrada — GMomentum</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --acento:#0E6B62;
  --acento-clr:#4FB3A5;
  --noche:#101614;
  --grafito:#1B2320;
  --papel:#FFFFFF;
  --gris-noche:#97A5A0;
  --linea:rgba(255,255,255,.14);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --texto:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:var(--noche);
  color:var(--papel);
  font-family:var(--texto);
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;position:relative}
.header,.footer{position:relative;z-index:3}
.header{border-bottom:1px solid var(--linea)}
.header-inner,.footer-inner,.content{
  width:min(100% - 40px,1220px);
  margin-inline:auto;
}
.header-inner{height:78px;display:flex;align-items:center;justify-content:space-between}
.brand{
  font-family:var(--display);
  font-variation-settings:"wdth" 118;
  font-weight:800;
  letter-spacing:-.035em;
  font-size:1.3rem;
  text-decoration:none;
}
.lang{
  border:1px solid var(--linea);
  border-radius:999px;
  padding:8px 13px;
  color:var(--gris-noche);
  background:transparent;
  font:500 .82rem var(--texto);
  cursor:pointer;
}
.lang:hover,.lang:focus-visible{color:var(--papel);border-color:var(--acento-clr)}
.content{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);
  align-items:center;
  gap:clamp(32px,7vw,96px);
  padding-block:clamp(64px,10vh,130px);
}
.kicker{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--acento-clr);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:.78rem;
  font-weight:600;
  margin:0 0 24px;
}
.kicker::before{content:"";width:34px;height:1px;background:currentColor}
h1{
  font-family:var(--display);
  font-variation-settings:"wdth" 118;
  font-size:clamp(3rem,7vw,6.4rem);
  line-height:.94;
  letter-spacing:-.055em;
  margin:0 0 26px;
  max-width:780px;
}
.copy{color:var(--gris-noche);max-width:580px;margin:0 0 36px;font-size:clamp(1rem,1.5vw,1.15rem)}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{
  min-height:50px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:12px 20px;
  border:1px solid var(--linea);
  border-radius:4px;
  font-weight:600;
  text-decoration:none;
  transition:.2s ease;
}
.btn-primary{background:var(--acento);border-color:var(--acento)}
.btn-primary:hover{background:#0A4F48;border-color:#0A4F48;transform:translateY(-2px)}
.btn-ghost:hover{border-color:var(--acento-clr);color:var(--acento-clr)}
.visual{
  position:relative;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  max-width:470px;
  justify-self:end;
}
.code{
  position:relative;
  z-index:2;
  font-family:var(--display);
  font-variation-settings:"wdth" 118;
  font-size:clamp(7rem,18vw,14rem);
  font-weight:800;
  line-height:1;
  letter-spacing:-.09em;
  color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.54);
}
.orbit,.orbit::before,.orbit::after{
  position:absolute;
  border:1px solid var(--linea);
  border-radius:50%;
}
.orbit{inset:8%;animation:spin 18s linear infinite}
.orbit::before{content:"";inset:15%}
.orbit::after{content:"";width:13px;height:13px;background:var(--acento-clr);border:0;top:12%;left:12%;box-shadow:0 0 30px var(--acento-clr)}
.cross{position:absolute;inset:0;background:linear-gradient(transparent calc(50% - .5px),var(--linea) 50%,transparent calc(50% + .5px)),linear-gradient(90deg,transparent calc(50% - .5px),var(--linea) 50%,transparent calc(50% + .5px));opacity:.65}
.glow{position:absolute;width:60vw;height:60vw;max-width:850px;max-height:850px;border-radius:50%;right:-28vw;top:5%;background:radial-gradient(circle,rgba(14,107,98,.22),transparent 66%);pointer-events:none}
.footer{border-top:1px solid var(--linea)}
.footer-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--gris-noche);font-size:.82rem}
.status{display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acento-clr);box-shadow:0 0 12px var(--acento-clr)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){
  .header-inner{height:68px}
  .content{grid-template-columns:1fr;padding-block:58px 44px}
  .visual{order:-1;width:min(72vw,330px);justify-self:center;margin-bottom:-20px}
  .code{font-size:clamp(6.7rem,35vw,10rem)}
  .footer-inner{min-height:82px;align-items:flex-start;justify-content:center;flex-direction:column;padding-block:18px}
}
@media (prefers-reduced-motion:reduce){.orbit{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="glow" aria-hidden="true"></div>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/">GMomentum</a>
      <button class="lang" id="lang" type="button">English</button>
    </div>
  </header>

  <main class="content">
    <section>
      <p class="kicker" id="kicker">Señal interrumpida</p>
      <h1 id="title">Esta página salió del radar.</h1>
      <p class="copy" id="copy">La dirección puede haber cambiado o ya no existe. Regresa al inicio para seguir construyendo momentum.</p>
      <div class="actions">
        <a class="btn btn-primary" id="home" href="/">Volver al inicio <span aria-hidden="true">→</span></a>
        <a class="btn btn-ghost" id="wa" href="https://wa.me/522214276989?text=Hola%2C%20vi%20su%20sitio%20y%20necesito%20ayuda." target="_blank" rel="noopener">Hablar por WhatsApp</a>
      </div>
    </section>

    <div class="visual" aria-hidden="true">
      <div class="cross"></div>
      <div class="orbit"></div>
      <div class="code">404</div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© <span id="year"></span> GMomentum</span>
      <span class="status"><span class="dot"></span><span id="status">Growth marketing y automatización · México</span></span>
    </div>
  </footer>
</div>
<script>
const copy={
  es:{
    lang:"English",title:"Esta página salió del radar.",kicker:"Señal interrumpida",
    copy:"La dirección puede haber cambiado o ya no existe. Regresa al inicio para seguir construyendo momentum.",
    home:"Volver al inicio",wa:"Hablar por WhatsApp",status:"Growth marketing y automatización · México",
    url:"/",waUrl:"https://wa.me/522214276989?text="+encodeURIComponent("Hola, vi su sitio y necesito ayuda.")
  },
  en:{
    lang:"Español",title:"This page fell off the radar.",kicker:"Signal interrupted",
    copy:"The address may have changed or no longer exists. Head home to keep building momentum.",
    home:"Back to home",wa:"Chat on WhatsApp",status:"Growth marketing and automation · Mexico",
    url:"/en/",waUrl:"https://wa.me/522214276989?text="+encodeURIComponent("Hi, I saw your site and I need some help.")
  }
};
let locale=location.pathname.startsWith("/en/")?"en":"es";
function render(){
  const t=copy[locale];
  document.documentElement.lang=locale;
  document.title=locale==="es"?"Página no encontrada — GMomentum":"Page not found — GMomentum";
  document.getElementById("lang").textContent=t.lang;
  document.getElementById("title").textContent=t.title;
  document.getElementById("kicker").textContent=t.kicker;
  document.getElementById("copy").textContent=t.copy;
  document.getElementById("home").innerHTML=t.home+' <span aria-hidden="true">→</span>';
  document.getElementById("home").href=t.url;
  document.getElementById("wa").textContent=t.wa;
  document.getElementById("wa").href=t.waUrl;
  document.getElementById("status").textContent=t.status;
}
document.getElementById("lang").addEventListener("click",()=>{locale=locale==="es"?"en":"es";render()});
document.getElementById("year").textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
